[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "drampyml"
version = "1.0.0"
dependencies = [
    "frozendict>=2.4.6",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "networkx>=3.5",
    "pillow>=11.3.0",
    "pydantic>=2.0.0",
    "pydot>=4.0.1",
    "pytest>=8.4.2",
    "rustworkx>=0.16.0",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
]
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["."]
